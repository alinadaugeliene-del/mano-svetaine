<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Netrukus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Manrope:wght@400;600&display=swap">
<style>
/* Tamsus kambarys: visa scena viename ekrane, valdymas apačioje. Vienas akcentas – lemputės šviesa. */
:root{
  --room:#0e0d10;
  --wall:#17151a;
  --ink:#f3ead8;
  --muted:#8b8478;
  --amber:#ffcf7a;
  --line:#2a2730;
  --display:"Fraunces", Georgia, serif;
  --body:"Manrope", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--body);overflow:hidden}
.stage{position:relative;height:100%;display:flex;flex-direction:column}
canvas{display:block;width:100%;flex:1;min-height:0;touch-action:none;cursor:pointer}
video{display:none}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-top:1px solid var(--line);background:var(--wall)}
.hint{font-size:13px;color:var(--muted);max-width:46ch;line-height:1.45;margin:0}
.hint b{color:var(--ink);font-weight:600}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
input[type=range]{accent-color:var(--amber);width:120px}
button{font:600 13px var(--body);color:var(--room);background:var(--amber);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.status{font-size:12px;color:var(--amber);min-height:1em}
.top{position:absolute;top:0;left:0;right:0;text-align:center;padding-top:max(20px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top h1{font-family:var(--display);font-weight:300;font-style:italic;font-size:clamp(1.8rem,6vw,3rem);margin:0;color:var(--ink)}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
body{margin:0}
</style>

</head>
<body>
<div class="stage">
  <header class="top"><h1>Netrukus</h1><p>Svetainė kuriama. Kol kas – įjunk šviesą.</p></header>
  <canvas id="c" aria-label="Lemputė, kurią valdai ranka"></canvas>
  <video id="v" playsinline muted></video>
  <div class="bar">
    <p class="hint" id="hint">Su kamera: <b>greitai spragtelėk</b> – suglausk nykštį su smiliumi ir iškart atitrauk, lemputė įsijungs ar išsijungs. Kai šviečia, <b>pirštų tarpas</b> reguliuoja ryškumą. Be kameros spustelėk lemputę, o šviesą keisk ratuku arba slankikliu.</p>
    <div class="ctrls">
      <label for="br">Šviesa <input id="br" type="range" min="0" max="100" value="70"></label>
      <label for="wm">Šiluma <input id="wm" type="range" min="0" max="100" value="60"></label>
      <button id="cam">Įjungti kamerą</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>
</div>

<script type="module">
const c=document.getElementById('c'),x=c.getContext('2d');
const v=document.getElementById('v'),br=document.getElementById('br'),wm=document.getElementById('wm');
const statusEl=document.getElementById('status'),camBtn=document.getElementById('cam');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,dpr=1;
function size(){dpr=Math.min(devicePixelRatio||1,2);const r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();

// būsena: tikslas ir sušvelninta reikšmė
const S={tx:W*.5,ty:H*.45,x:W*.5,y:H*.45,tb:.7,b:.7,tw:.6,w:.6,tilt:0,ttilt:0,hand:null,cam:false};

// pelė / lietimas
S.on=true;
c.addEventListener('click',e=>{if(S.cam)return;const r=c.getBoundingClientRect();const d=Math.hypot(e.clientX-r.left-S.x,e.clientY-r.top-S.y);if(d<Math.min(W,H)*.25){S.on=!S.on}});
c.addEventListener('wheel',e=>{e.preventDefault();S.tb=Math.max(0,Math.min(1,S.tb-e.deltaY*.0012));br.value=Math.round(S.tb*100)},{passive:false});
br.addEventListener('input',()=>{S.tb=br.value/100;S.on=S.tb>0});
wm.addEventListener('input',()=>S.tw=wm.value/100);

// spalva pagal šilumą: šalta balta → gintarinė
function col(w,a){const r=255,g=Math.round(245-70*w),bl=Math.round(235-150*w);return `rgba(${r},${g},${bl},${a})`}

const words=['idėja','šviesa','sumanymas','įkvėpimas','atradimas','kūryba'];
const spots=[];for(let i=0;i<26;i++)spots.push({u:Math.random(),v:Math.random(),t:words[i%words.length],s:14+Math.random()*30});

function draw(t){
  const k=reduce?1:.18;
  S.x=W/2;S.y=H*.46;S.b+=((S.on?S.tb:0)-S.b)*k;S.w+=(S.tw-S.w)*k;
  const b=S.b,flick=reduce?1:1+Math.sin(t*.011)*.012+Math.sin(t*.037)*.008;
  x.fillStyle='#0e0d10';x.fillRect(0,0,W,H);

  // kamera kaip blankus fonas
  if(S.cam&&v.readyState>=2){x.save();x.globalAlpha=.12+.25*b;x.translate(W,0);x.scale(-1,1);
    const vr=v.videoWidth/v.videoHeight,cr=W/H;let dw=W,dh=H;if(vr>cr)dw=H*vr;else dh=W/vr;
    x.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);x.restore()}

  // žodžiai ant sienos, matomi tik šviesoje
  const R=Math.max(W,H)*(.12+.55*b)*flick;
  x.save();x.font='300 20px Fraunces, Georgia, serif';x.textAlign='center';
  for(const s of spots){const px=s.u*W,py=s.v*H,d=Math.hypot(px-S.x,py-S.y);const a=Math.max(0,1-d/R)*b;if(a<.02)continue;
    x.globalAlpha=a*.85;x.fillStyle=col(S.w,1);x.font=`300 ${s.s}px Fraunces, Georgia, serif`;x.fillText(s.t,px,py)}
  x.restore();

  // švytėjimas
  x.save();x.globalCompositeOperation='lighter';
  let g=x.createRadialGradient(S.x,S.y,0,S.x,S.y,R);
  g.addColorStop(0,col(S.w,.55*b));g.addColorStop(.25,col(S.w,.18*b));g.addColorStop(1,col(S.w,0));
  x.fillStyle=g;x.fillRect(0,0,W,H);x.restore();

  // lemputė
  const sc=Math.min(W,H)/520;
  x.save();x.strokeStyle='#4a4650';x.lineWidth=2;x.beginPath();x.moveTo(S.x,0);x.lineTo(S.x,S.y-92*sc);x.stroke();
  x.fillStyle='#2a2730';x.fillRect(S.x-14*sc,S.y-108*sc,28*sc,18*sc);x.restore();
  x.save();x.translate(S.x,S.y);x.rotate(Math.PI);x.scale(sc,sc);
  // stiklas
  x.beginPath();x.moveTo(-22,52);x.bezierCurveTo(-24,30,-62,10,-62,-30);x.arc(0,-30,62,Math.PI,0);x.bezierCurveTo(62,10,24,30,22,52);x.closePath();
  const gg=x.createRadialGradient(0,-20,4,0,-20,70);gg.addColorStop(0,col(S.w,.25+.75*b));gg.addColorStop(1,col(S.w,.06+.3*b));
  x.fillStyle=gg;x.fill();x.lineWidth=2;x.strokeStyle=`rgba(243,234,216,${.35+.4*(1-b)})`;x.stroke();
  // siūlas
  x.beginPath();x.moveTo(-12,48);x.lineTo(-10,-6);for(let i=0;i<6;i++){x.lineTo(-8+i*3.2,i%2?-16:-4)}x.lineTo(10,-6);x.lineTo(12,48);
  x.lineWidth=2.4;x.strokeStyle=b>.05?col(S.w*.3+.7,.6+.4*b):'rgba(120,112,100,.8)';x.stroke();
  // cokolis
  x.fillStyle='#8b8478';for(let i=0;i<4;i++){x.fillRect(-23+i*1,52+i*9,46-i*2,7)}
  x.fillStyle='#4a4650';x.beginPath();x.arc(0,90,9,0,Math.PI);x.fill();
  x.restore();

  // rankos taškai
  if(S.hand){x.save();x.strokeStyle='rgba(243,234,216,.35)';x.fillStyle='rgba(255,207,122,.9)';x.lineWidth=1.5;
    const P=S.hand.map(p=>[(1-p.x)*W,p.y*H]);
    const L=[[0,1,2,3,4],[0,5,6,7,8],[5,9,10,11,12],[9,13,14,15,16],[13,17,18,19,20],[0,17]];
    for(const l of L){x.beginPath();l.forEach((i,j)=>j?x.lineTo(...P[i]):x.moveTo(...P[i]));x.stroke()}
    x.beginPath();x.moveTo(...P[4]);x.lineTo(...P[8]);x.setLineDash([4,5]);x.strokeStyle='rgba(255,207,122,.7)';x.stroke();
    for(const i of [4,8]){x.beginPath();x.arc(...P[i],5,0,7);x.fill()}x.restore();
    const fa=S.flash?Math.max(0,1-(t-S.flash)/400):0;if(fa>0){x.save();x.strokeStyle=`rgba(255,207,122,${fa})`;x.lineWidth=3;x.beginPath();x.arc((P[4][0]+P[8][0])/2,(P[4][1]+P[8][1])/2,12+30*(1-fa),0,7);x.stroke();x.restore()}}

  // žymeklis be kameros
  x.fillStyle='rgba(243,234,216,.6)';x.font='600 12px Manrope, system-ui, sans-serif';x.textAlign='center';
  x.fillText(S.on&&S.tb>.02?Math.round(S.tb*100)+' %':'IŠJUNGTA',S.x,S.y+sc*125);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// kamera + MediaPipe rankų sekimas
let lm=null;
camBtn.addEventListener('click',async()=>{
  if(S.cam){v.srcObject?.getTracks().forEach(t=>t.stop());S.cam=false;S.hand=null;camBtn.textContent='Įjungti kamerą';camBtn.className='';statusEl.textContent='';return}
  statusEl.textContent='Kraunamas rankų atpažinimas…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    v.srcObject=stream;await v.play();
    if(!lm){
      const {FilesetResolver,HandLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      lm=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});
    }
    S.cam=true;camBtn.textContent='Išjungti kamerą';camBtn.className='ghost';statusEl.textContent='Parodyk ranką kamerai';
    let last=-1;
    const loop=()=>{if(!S.cam)return;
      if(v.currentTime!==last){last=v.currentTime;const r=lm.detectForVideo(v,performance.now());
        const h=r.landmarks?.[0];S.hand=h||null;
        if(h){statusEl.textContent='';
          const hs=Math.hypot(h[0].x-h[9].x,h[0].y-h[9].y)||.1;
          const pinch=Math.hypot(h[4].x-h[8].x,h[4].y-h[8].y)/hs;
          const now=performance.now();
          if(pinch<.14&&!S.closed){S.closed=true;S.closedAt=now}
          else if(pinch>.26&&S.closed){S.closed=false;if(now-S.closedAt<500){S.on=!S.on;S.flash=now}}
          if(S.on&&!S.closed&&pinch>.32){S.tb=Math.max(.05,Math.min(1,(pinch-.32)/.75));br.value=Math.round(S.tb*100)}
        }else statusEl.textContent='Ranka nematoma';
      }
      requestAnimationFrame(loop)};
    loop();
  }catch(e){
    v.srcObject?.getTracks().forEach(t=>t.stop());
    statusEl.textContent='Kamera čia nepasiekiama. Atsisiųsk failą ir atidaryk jį naršyklėje – ten kamera veiks.';
  }
});
</script>

</body>
</html>
